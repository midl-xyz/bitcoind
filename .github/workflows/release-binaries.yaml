name: Release Binaries

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to upload assets to (for manual runs)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for ${{ matrix.arch }}
        run: |
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --load \
            --tag bitcoind:${{ matrix.arch }} \
            .

      - name: Extract bitcoind binary
        run: |
          set -euo pipefail

          BITCOIN_VERSION="$(grep -m1 '^ENV BITCOIN_VERSION=' Dockerfile | cut -d= -f2)"
          CONTAINER_ID="$(docker create bitcoind:${{ matrix.arch }})"
          mkdir -p dist
          docker cp "${CONTAINER_ID}:/opt/bitcoin-${BITCOIN_VERSION}/bin/bitcoind" "dist/bitcoind-linux-${{ matrix.arch }}"
          docker rm "${CONTAINER_ID}"
          chmod +x "dist/bitcoind-linux-${{ matrix.arch }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitcoind-linux-${{ matrix.arch }}
          path: dist/bitcoind-linux-${{ matrix.arch }}
          if-no-files-found: error

  upload-release-assets:
    name: Upload release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bitcoind-linux-*
          merge-multiple: true
          path: dist

      - name: Rename assets with release tag
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.value }}"
          mv "dist/bitcoind-linux-amd64" "dist/bitcoind-${TAG}-linux-amd64"
          mv "dist/bitcoind-linux-arm64" "dist/bitcoind-${TAG}-linux-arm64"

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: |
            dist/bitcoind-${{ steps.tag.outputs.value }}-linux-amd64
            dist/bitcoind-${{ steps.tag.outputs.value }}-linux-arm64
          fail_on_unmatched_files: true
